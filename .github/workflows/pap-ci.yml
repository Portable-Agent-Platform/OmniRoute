name: PAP CI

on:
  pull_request:
    branches: [pap/main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [pap/main]
  workflow_dispatch:

concurrency:
  group: pap-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  DISABLE_SQLITE_AUTO_BACKUP: "true"

jobs:
  pap-gate:
    name: PAP Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Diff integrity
        run: git diff --check origin/${{ github.base_ref || 'pap/main' }}...HEAD

      - name: Core typecheck
        run: npm run typecheck:core

      - name: PAP and NVIDIA regression tests
        run: >-
          node --import tsx/esm
          --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts
          --test --test-force-exit
          tests/unit/pap-*.test.ts
          tests/unit/nvidia-nim-validator.test.ts
