name: PAP Bootstrap Request Brand Formatting

on:
  push:
    branches: [pap/request-brand-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Normalize verified patch formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("open-sse/utils/earlyStreamKeepalive.ts")
          s = p.read_text()
          old = '''  // Next.js route handlers can hand us a Request from a different fetch realm.
          // Passing that foreign object directly to Node's global Request constructor can
          // fail private-brand checks before routing begins. Rebuild from Web-standard
          // primitives instead; the body stream remains zero-copy and admission consumes it
          // immediately into its bounded byte buffer.
          const method = request.method;
          const hasBody = method !== "GET" && method !== "HEAD" && request.body !== null;
          const requestInit: RequestInit & { duplex?: "half" } = {
          method,
          headers,
          signal: combined,
          };
          if (hasBody) {
          requestInit.body = request.body;
          requestInit.duplex = "half";
          }
          const wrappedReq = new Request(request.url, requestInit);'''
          # The previous one-shot replacement intentionally used exact text but Python
          # heredoc dedenting removed indentation from all lines after the first.
          actual = '''  // Next.js route handlers can hand us a Request from a different fetch realm.
          // Passing that foreign object directly to Node's global Request constructor can
          // fail private-brand checks before routing begins. Rebuild from Web-standard
          // primitives instead; the body stream remains zero-copy and admission consumes it
          // immediately into its bounded byte buffer.
          const method = request.method;
          const hasBody = method !== "GET" && method !== "HEAD" && request.body !== null;
          const requestInit: RequestInit & { duplex?: "half" } = {
          method,
          headers,
          signal: combined,
          };
          if (hasBody) {
          requestInit.body = request.body;
          requestInit.duplex = "half";
          }
          const wrappedReq = new Request(request.url, requestInit);'''
          # Match the real block by locating stable boundaries and rewrite it with style-correct indentation.
          start = s.index('  // Next.js route handlers can hand us a Request from a different fetch realm.')
          end_marker = 'const wrappedReq = new Request(request.url, requestInit);'
          end = s.index(end_marker, start) + len(end_marker)
          replacement = '''  // Next.js route handlers can hand us a Request from a different fetch realm.
            // Passing that foreign object directly to Node's global Request constructor can
            // fail private-brand checks before routing begins. Rebuild from Web-standard
            // primitives instead; the body stream remains zero-copy and admission consumes it
            // immediately into its bounded byte buffer.
            const method = request.method;
            const hasBody = method !== "GET" && method !== "HEAD" && request.body !== null;
            const requestInit: RequestInit & { duplex?: "half" } = {
              method,
              headers,
              signal: combined,
            };
            if (hasBody) {
              requestInit.body = request.body;
              requestInit.duplex = "half";
            }
            const wrappedReq = new Request(request.url, requestInit);'''
          # Dedent exactly two characters from the heredoc's continuation indentation.
          replacement = '\n'.join(line[2:] if line.startswith('  ') else line for line in replacement.splitlines())
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git diff --check

      - name: Commit formatting cleanup and remove bootstrap
        run: |
          rm .github/workflows/pap-bootstrap-request-brand-format.yml
          git config user.name "PAP Automation"
          git config user.email "pap-automation@users.noreply.github.com"
          git add open-sse/utils/earlyStreamKeepalive.ts .github/workflows/pap-bootstrap-request-brand-format.yml
          git commit -m "PAP: format cross-realm request fix"
          git push origin HEAD:pap/request-brand-v1
