name: PAP Container

on:
  pull_request:
    branches: [pap/main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [pap/main]
  workflow_dispatch:

concurrency:
  group: pap-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build PAP OmniRoute image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/portable-agent-platform/omniroute
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          tags: |
            ${{ env.IMAGE }}:pap-main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Portable-Agent-Platform/OmniRoute
            org.opencontainers.image.revision=${{ github.sha }}
            io.portable-agent-platform.channel=pap-main
          cache-from: type=gha,scope=pap-omniroute-amd64
          cache-to: type=gha,scope=pap-omniroute-amd64,mode=max,ignore-error=true

      - name: Resolve smoke-test image
        id: smoke-image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="${IMAGE}:sha-${GITHUB_SHA}"
          else
            ref="${IMAGE}@${{ steps.build.outputs.digest }}"
            docker pull "$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Runtime health and chat-route smoke test
        shell: bash
        env:
          SMOKE_IMAGE: ${{ steps.smoke-image.outputs.ref }}
        run: |
          set -euo pipefail
          name="pap-omniroute-smoke-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" --restart no \
            -e REQUIRE_API_KEY=false \
            -e OMNIROUTE_MEMORY_MB=1024 \
            "$SMOKE_IMAGE" >/dev/null
          healthy=0
          for _ in $(seq 1 36); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$name")"
            if [ "$status" = healthy ]; then healthy=1; break; fi
            if [ "$status" = exited ] || [ "$status" = dead ]; then break; fi
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            docker logs --tail 120 "$name" >&2 || true
            exit 1
          fi
          docker exec "$name" node healthcheck.mjs
          docker exec -i "$name" node --input-type=module - <<'NODE'
          const response = await fetch("http://127.0.0.1:20128/v1/chat/completions", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ model: 123, messages: [{ role: "user", content: "test" }] }),
          });
          const body = await response.text();
          if (response.status !== 400) {
            console.error(`chat route smoke expected 400, received ${response.status}: ${body.slice(0, 500)}`);
            process.exit(1);
          }
          NODE

      - name: Record image identity
        run: |
          echo "### PAP OmniRoute container" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime health: \`PASS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chat route smoke: \`PASS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: \`${{ github.event_name != 'pull_request' }}\`" >> "$GITHUB_STEP_SUMMARY"
