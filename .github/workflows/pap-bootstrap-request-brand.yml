name: PAP Bootstrap Request Brand Fix

on:
  push:
    branches: [pap/request-brand-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply verified canary patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("open-sse/utils/earlyStreamKeepalive.ts")
          s = p.read_text()
          old = '  const wrappedReq = new Request(request, { signal: combined, headers });'
          new = '''  // Next.js route handlers can hand us a Request from a different fetch realm.
          // Passing that foreign object directly to Node's global Request constructor can
          // fail private-brand checks before routing begins. Rebuild from Web-standard
          // primitives instead; the body stream remains zero-copy and admission consumes it
          // immediately into its bounded byte buffer.
          const method = request.method;
          const hasBody = method !== "GET" && method !== "HEAD" && request.body !== null;
          const requestInit: RequestInit & { duplex?: "half" } = {
            method,
            headers,
            signal: combined,
          };
          if (hasBody) {
            requestInit.body = request.body;
            requestInit.duplex = "half";
          }
          const wrappedReq = new Request(request.url, requestInit);'''
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one request constructor target, found {s.count(old)}")
          s = s.replace(old, new, 1)
          stale = " * `new Request(request, { signal, headers })`, which preserves method, url and\n * body byte-for-byte."
          fresh = " * a URL + explicit method/headers/body-stream RequestInit, which preserves method, url and\n * body byte-for-byte without crossing fetch-realm private brands."
          if stale not in s:
              raise SystemExit("deadline request reconstruction doc target not found")
          p.write_text(s.replace(stale, fresh, 1))
          PY
          git diff --check

      - name: Commit source patch and remove bootstrap
        run: |
          rm .github/workflows/pap-bootstrap-request-brand.yml
          git config user.name "PAP Automation"
          git config user.email "pap-automation@users.noreply.github.com"
          git add open-sse/utils/earlyStreamKeepalive.ts .github/workflows/pap-bootstrap-request-brand.yml
          git commit -m "PAP: support cross-realm route requests"
          git push origin HEAD:pap/request-brand-v1
